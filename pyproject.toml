[project]
name = "ai-secure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Uday Sankar", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
